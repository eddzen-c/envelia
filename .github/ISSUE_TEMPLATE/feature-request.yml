name: Feature request
description: Propose an improvement or new capability for Envelia Studio
title: '[Feature]: '
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape Envelia Studio.

        Describe the problem before proposing a solution. Do not include private
        invitations, credentials, personal data, or confidential information.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the product area that would receive the improvement.
      options:
        - Marketing website
        - Invitation editor
        - Invitation experience
        - Guest and RSVP management
        - Authentication and accounts
        - API and backend
        - Email, WhatsApp, or notifications
        - Infrastructure and developer tooling
        - New product area
    validations:
      required: true

  - type: dropdown
    id: affected-users
    attributes:
      label: Affected users
      description: Select the principal audience that would benefit.
      options:
        - Event hosts
        - Guests
        - Designers and agencies
        - Platform administrators
        - Developers and maintainers
        - Multiple user groups
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the current limitation, need, or opportunity.
      placeholder: Describe who experiences the problem, when it occurs, and its impact.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or capability you would like to introduce.
      placeholder: Explain the desired experience without depending on implementation details.
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Express the proposal from the affected user's perspective.
      placeholder: 'As an event host, I want... so that...'
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the feature complete.
      placeholder: |
        - [ ] The user can...
        - [ ] The system prevents...
        - [ ] The interface communicates...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or other solutions you evaluated.

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add research, examples, screenshots, references, or user feedback when available.

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Indicate the expected effect on existing behavior or stored data.
      options:
        - Backward-compatible change
        - May require a migration
        - Breaking change
        - Not yet determined
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have read and agree to follow the [Code of Conduct](https://github.com/eddzen-c/envelia/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true
        - label: I searched existing issues and did not find an equivalent request.
          required: true
        - label: I explained the underlying problem before prescribing implementation details.
          required: true
        - label: I removed credentials, personal data, and confidential information.
          required: true
